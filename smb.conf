[global]
   server role = standalone server
   workgroup = WORKGROUP
   server string = share
   disable netbios = yes
   smb ports = 445

   server min protocol = NT1
   server max protocol = SMB3
   ntlm auth = ntlmv1-permitted
   server signing = disabled
   server smb encrypt = off

   map to guest = Bad User
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log level = 1

[share]
   path = /srv/samba/share
   read only = yes
   browseable = yes
   guest ok = no
   valid users = admin
   follow symlinks = no
